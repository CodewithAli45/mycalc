<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Engineer's Dashboard</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0f17;
        color: #f1f5f9;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        text-align: center;
      }
      .box {
        padding: 32px;
        border: 1px solid rgba(148, 163, 184, 0.15);
        border-radius: 16px;
        background: #111827;
        max-width: 320px;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 8px;
      }
      p {
        color: #94a3b8;
        font-size: 0.9rem;
        margin: 0 0 16px;
      }
      a,
      button {
        background: #38bdf8;
        color: #0b0f17;
        border: 0;
        padding: 10px 18px;
        border-radius: 10px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>You are offline</h1>
      <p>Your dashboard tools work offline. Tap below to keep calculating.</p>
      <button onclick="location.href='/'">Back to dashboard</button>
    </div>
  </body>
</html>
